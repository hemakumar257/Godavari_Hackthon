<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Outer Gold Ring -->
  <circle cx="60" cy="60" r="57" fill="#0A2540" stroke="#F59E0B" stroke-width="3" />
  <circle cx="60" cy="60" r="51" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.5" />
  
  <!-- Radiating Sun Rays representing Andhra Pradesh sunrise -->
  <g stroke="#F59E0B" stroke-width="1.8" opacity="0.85">
    <line x1="60" y1="12" x2="60" y2="18" />
    <line x1="60" y1="102" x2="60" y2="108" />
    <line x1="12" y1="60" x2="18" y2="60" />
    <line x1="102" y1="60" x2="108" y2="60" />
    <line x1="26" y1="26" x2="31" y2="31" />
    <line x1="89" y1="89" x2="94" y2="94" />
    <line x1="26" y1="94" x2="31" y2="89" />
    <line x1="89" y1="31" x2="94" y2="26" />
  </g>
  
  <!-- Circular Decorative Bead Border -->
  <circle cx="60" cy="60" r="43" fill="#FFFBEB" stroke="#D97706" stroke-width="1.2" stroke-dasharray="2,2" />
  
  <!-- Sacred Amaravati Poornakumbham (Purna Kalash) of AP State Emblem -->
  <!-- Kalash Base & Pot -->
  <path d="M42 78 C42 85, 78 85, 78 78 C78 74, 72 70, 68 68 C74 65, 76 58, 74 52 C72 47, 66 45, 60 45 C54 45, 48 47, 46 52 C44 58, 46 65, 52 68 C48 70, 42 74, 42 78 Z" fill="#D97706" stroke="#B45309" stroke-width="1.5" />
  
  <!-- Sacred Coconut & Mango Leaves (Poornakumbham) -->
  <!-- Mango Leaves -->
  <path d="M60 45 C55 35, 45 36, 44 42 C48 46, 54 45, 60 45 Z" fill="#16A34A" />
  <path d="M60 45 C65 35, 75 36, 76 42 C72 46, 66 45, 60 45 Z" fill="#16A34A" />
  <path d="M60 45 C58 32, 52 28, 50 34 C54 39, 58 42, 60 45 Z" fill="#15803D" />
  <path d="M60 45 C62 32, 68 28, 70 34 C66 39, 62 42, 60 45 Z" fill="#15803D" />
  <!-- Sacred Central Coconut -->
  <ellipse cx="60" cy="38" rx="7" ry="9" fill="#B45309" stroke="#78350F" stroke-width="1" />
  <circle cx="60" cy="34" r="2" fill="#FDE68A" />
  
  <!-- Ashoka Chakra / Dharma Wheel Mini Emblem at Base -->
  <circle cx="60" cy="60" r="6" fill="#1E3A8A" stroke="#F59E0B" stroke-width="1" />
  <circle cx="60" cy="60" r="2" fill="#FFFFFF" />
  
  <!-- Lotus Petals at the Bottom -->
  <path d="M38 88 C48 83, 72 83, 82 88 C76 94, 44 94, 38 88 Z" fill="#DC2626" />
  
  <!-- Text Ring Elements -->
  <text x="60" y="22" font-size="5.5" font-weight="bold" fill="#0A2540" text-anchor="middle" font-family="sans-serif">GOVT OF ANDHRA PRADESH</text>
  <text x="60" y="100" font-size="5.5" font-weight="bold" fill="#0A2540" text-anchor="middle" font-family="sans-serif">आंध्र प्रदेश सरकार</text>
</svg>
